[package]
name = "rs-term"
version = "0.1.0"
edition = "2021"
description = "A node-based terminal manager — terminals and notes on an infinite canvas. A Rust reimagining of nodeterm."

[dependencies]
eframe = "=0.29.1"
egui = "=0.29.1"
portable-pty = "0.8"
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
